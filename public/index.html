<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFmpeg Web Converter</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101522;color:#edf2ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(680px,100%);background:#1a2335;border:1px solid #34415b;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}
h1{margin:0 0 8px;font-size:1.8rem}p{color:#b9c5da;line-height:1.5}
label{display:block;margin:24px 0 8px;font-weight:650}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #465675;background:#0e1522;color:white;font:inherit}
button{margin-top:14px;padding:13px 18px;border:0;border-radius:10px;background:#6c8cff;color:#071020;font-weight:750;font-size:1rem;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#status{margin-top:22px;padding:14px;border-radius:10px;background:#0e1522;white-space:pre-wrap;overflow-wrap:anywhere;min-height:48px}
a{display:inline-block;margin-top:16px;color:#9db5ff;font-weight:700}
small{display:block;color:#9eabc2;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<main>
  <h1>Téléchargeur FFmpeg</h1>
  <p>Colle une URL de flux HLS (.m3u8).</p>
  <form id="form">
    <label for="url">URL du flux</label>
    <input id="url" type="url" placeholder="https://exemple.com/video.m3u8" required>
    <button id="submit" type="submit">Convertir en MP4</button>
  </form>
  <div id="status" role="status">En attente d'une URL.</div>
  <a id="download">⬇ Télécharger video.mp4</a>
</main>
<script>
const params = new URLSearchParams(window.location.search);
const query = params.get('query')||params.get('q');

const form = document.querySelector("#form");
const input = document.querySelector("#url");
const button = document.querySelector("#submit");
const statusBox = document.querySelector("#status");
const download = document.querySelector("#download");

if(query){
  input.value=decodeURIComponent(query)
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  button.disabled = true;
  download.hidden = true;
  statusBox.textContent = "Démarrage de la conversion…";

  try {
    const response = await fetch("/api/convert", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({url: input.value.trim()})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Impossible de démarrer.");
    await poll(data.id);
  } catch (error) {
    statusBox.textContent = "Erreur : " + error.message;
    button.disabled = false;
  }
});

async function poll(id) {
  const response = await fetch("/api/status/" + encodeURIComponent(id));
  const job = await response.json();
  if (!response.ok) throw new Error(job.error || "Erreur de suivi.");

  statusBox.textContent = job.status === "running"
    ? "⏳ Conversion en cours…\n" + job.message + "\nTemps écoulé : " + job.elapsedSeconds + " s"
    : (job.status === "done" ? "✅ " : "❌ ") + job.message;

  if (job.status === "running") {
    setTimeout(() => poll(id).catch(fail), 1200);
  } else {
    button.disabled = false;
    if (job.status === "done") {
      download.href = job.downloadUrl;
      download.hidden = false;
    }
  }
}
function fail(error) {
  statusBox.textContent = "Erreur : " + error.message;
  button.disabled = false;
}
</script>
</body>
</html>
